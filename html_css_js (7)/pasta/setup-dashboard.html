<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<text y='75' font-size='75'>🚀</text></svg>">
  <link rel="stylesheet" href="setup-dashboard.css">
  <title>🚀 Setup Dashboard</title>
  <!-- PWA:inicio (gerado pelo Mini SK — pode refazer no painel 📱 PWA) -->
  <link rel="manifest" href="setup-dashboard.webmanifest">
  <meta name="theme-color" content="#667eea">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="🚀 Setup Das">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      addEventListener('load', function () { navigator.serviceWorker.register('service-worker.js').catch(function (e) { console.warn('Service worker:', e); }); });
    }
  </script>
  <!-- PWA:fim -->
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>🚀 Setup Dashboard</h1>
      <p>Configure todos os seus projetos com um clique</p>
    </div>

    <div class="quick-actions">
      <h2>⚡ Ações Rápidas</h2>
      <div class="quick-grid">
        <button class="quick-btn" onclick="setupAll()">🔧 Setup Completo</button>
        <button class="quick-btn" onclick="buildAll()">🔨 Build Todos</button>
        <button class="quick-btn" onclick="clearTerminal()">🗑️ Limpar</button>
        <button class="quick-btn" onclick="copyAllCommands()">📋 Copiar Todos</button>
      </div>
    </div>

    <div class="projects-grid" id="projectsGrid"></div>

    <div class="commands-section">
      <h2>📋 Comandos para Copiar</h2>
      <div id="commandsList"></div>
      <div class="terminal" id="terminal"></div>
    </div>

    <div class="footer">
      <p>✨ Dashboard de Setup - Monorepo 2026</p>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2 id="modalTitle">Confirmação</h2>
      <p id="modalText"></p>
      <div class="modal-buttons">
        <button class="btn btn-danger" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="confirmAction()">Confirmar</button>
      </div>
    </div>
  </div>

<script src="setup-dashboard.js"></script>
</body>

</html>
